apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api-production
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-api-production
  template:
    metadata:
      labels:
        app: product-api-production
    spec:
      containers:
        - name: product-api
          image: ghcr.io/bhavin21187/devops-product-api:v2
          ports:
            - containerPort: 8080